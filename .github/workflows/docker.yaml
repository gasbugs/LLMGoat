#
name: Create and publish a Docker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish under ghcr.io/gasbugs
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU Docker image
        id: push-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llmgoat-cpu:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository_owner }}/llmgoat-cpu:latest

      - name: Build and push GPU Docker image
        id: push-gpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/llmgoat-gpu:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository_owner }}/llmgoat-gpu:latest
